<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVAILO OneChat</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&family=Ramabhadra&family=Suranna&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030b1e;
            --panel-bg: #071530;
            --cyan-glow: #00e5ff;
            --text-sub: #94a3b8;
            --green-wa: #16a34a;
            --border-glow: 1px solid rgba(0, 229, 255, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .te-heading { font-family: 'Ramabhadra', sans-serif; }
        .te-body { font-family: 'Suranna', serif; }

        header {
            background: var(--panel-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: var(--border-glow);
        }

        .back-btn {
            color: var(--cyan-glow);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .chat-header-profile {
            text-align: center;
            padding: 18px 16px;
            background: radial-gradient(circle, #0e2a47 0%, #030b1e 100%);
            border-bottom: var(--border-glow);
        }

        .mayura-circle-chat {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--cyan-glow);
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bot-msg-card {
            background: var(--panel-bg);
            border: var(--border-glow);
            border-radius: 10px;
            padding: 14px;
            max-width: 90%;
        }

        .quick-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .quick-btn {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.25);
            padding: 11px 12px;
            border-radius: 6px;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13.5px;
        }

        .quick-btn:active {
            border-color: var(--cyan-glow);
            background: rgba(0, 229, 255, 0.15);
        }

        .input-bar {
            background: var(--panel-bg);
            border-top: var(--border-glow);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-field {
            flex: 1;
            background: #030b1e;
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 10px 14px;
            border-radius: 20px;
            color: #ffffff;
            outline: none;
            font-size: 13.5px;
        }

        .btn-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-mic { background: #1e293b; color: var(--cyan-glow); }
        .btn-send { background: var(--green-wa); color: #ffffff; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn te-heading">‹ హోమ్</a>
        <div style="font-size: 12px; color: var(--cyan-glow);">● ఆన్‌లైన్ (AI Mayura)</div>
    </header>

    <div class="chat-header-profile">
        <div class="mayura-circle-chat">🦚</div>
        <h3 class="te-heading" style="font-size: 16px;">AVAILO OneChat</h3>
        <p class="te-body" style="font-size: 12px; color: var(--text-sub);">నమస్కారం! నేను మీ అవైలో మయూరను.</p>
    </div>

    <div class="chat-body">
        <div class="bot-msg-card">
            <p class="te-heading" style="font-size: 13.5px; color: var(--cyan-glow);">ఈ రోజు మీకు ఏ సహాయం కావాలి?</p>
            <p class="te-body" style="font-size: 12.5px; color: var(--text-sub); margin-top: 4px;">క్రింద ఉన్న సర్వీస్‌ను ఎంచుకోండి:</p>

            <div class="quick-links">
                <a href="https://wa.me/919966157369?text=హోమ్%20రిపేర్స్%20(ఎలక్ట్రికల్/ప్లంబింగ్)%20కావాలి" class="quick-btn">
                    <span>🛠️</span> <span class="te-heading">హోమ్ రిపేర్స్ (ఎలక్ట్రికల్ / ప్లంబర్)</span>
                </a>
                <a href="https://wa.me/919966157369?text=డైలీ%20కిరాణా%20ఆర్డర్" class="quick-btn">
                    <span>🛒</span> <span class="te-heading">డైలీ కిరాణా & తాజా సరుకులు</span>
                </a>
                <a href="https://wa.me/919966157369?text=NRI%20పేరెంట్స్%20కేర్%20సపోర్ట్" class="quick-btn">
                    <span>👴</span> <span class="te-heading">NRI పేరెంట్స్ కేర్ సపోర్ట్</span>
                </a>
                <a href="https://wa.me/919966157369?text=ఈ-వేస్ట్%20మరియు%20స్క్రాప్%20పికప్" class="quick-btn">
                    <span>♻️</span> <span class="te-heading">ఈ-వేస్ట్ & స్క్రాప్ పికప్</span>
                </a>
            </div>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="chatInput" class="input-field te-body" placeholder="టైప్ చేయండి లేదా మైక్ నొక్కండి...">
        <button class="btn-circle btn-mic" onclick="startVoiceInput()">🎤</button>
        <button class="btn-circle btn-send" onclick="submitToWhatsApp()">➤</button>
    </div>

    <script>
        function submitToWhatsApp() {
            const input = document.getElementById('chatInput').value.trim();
            const text = input ? encodeURIComponent(input) : "నమస్తే%20అవైలో,%20నాకు%20సర్వీస్%20కావాలి";
            window.location.href = `https://wa.me/919966157369?text=${text}`;
        }

        function startVoiceInput() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRecognition();
                rec.lang = 'te-IN';
                rec.start();
                rec.onresult = function(e) {
                    document.getElementById('chatInput').value = e.results[0][0].transcript;
                    submitToWhatsApp();
                };
            } else {
                alert("వాయిస్ టైపింగ్ సదుపాయం కోసం WhatsApp ఉపయోగించండి.");
            }
        }
    </script>
</body>
</html>
