<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVAILO OneChat</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284C7">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #070D18;
      --card-bg: #131E33;
      --neon-blue: #38BDF8;
      --green: #10B981;
      --text-main: #F8FAFC;
      --text-dim: #94A3B8;
      --border: #1E293B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans Telugu', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .chat-header {
      background: rgba(12, 20, 36, 0.98);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .bot-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid var(--neon-blue);
      background: #000;
      flex-shrink: 0;
    }
    .bot-info h2 { font-size: 0.95rem; font-weight: 800; color: #FFF; }
    .bot-info p { font-size: 0.68rem; color: var(--green); font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; display: inline-block; animation: blink 1.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .header-actions a { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; border: 1px solid var(--border); padding: 5px 10px; border-radius: 12px; }

    .install-banner {
      background: linear-gradient(90deg, #0369A1, #065F46);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .btn-install { background: #F59E0B; color: #000; border: none; padding: 4px 10px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.72rem; }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at top right, rgba(2, 132, 199, 0.08), transparent 60%);
    }

    .msg-row { display: flex; width: 100%; }
    .msg-row.bot { justify-content: flex-start; }
    .msg-row.user { justify-content: flex-end; }

    .bubble {
      max-width: 84%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      line-height: 1.45;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .msg-row.bot .bubble {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 2px;
      color: #F1F5F9;
    }
    .msg-row.user .bubble {
      background: #0284C7;
      color: #FFF;
      border-top-right-radius: 2px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }
    .opt-tile {
      background: rgba(19, 30, 51, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
    }
    .opt-tile:active {
      border-color: var(--neon-blue);
      background: rgba(56, 189, 248, 0.15);
      transform: scale(0.98);
    }
    .opt-icon { font-size: 1.3rem; display: block; margin-bottom: 2px; }
    .opt-label { font-size: 0.74rem; font-weight: 700; color: #FFF; }

    .chat-dock {
      background: rgba(12, 20, 36, 0.98);
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .input-box {
      flex: 1;
      background: #070D18;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 14px;
      color: #FFF;
      font-size: 0.85rem;
      outline: none;
    }
    .input-box:focus { border-color: var(--neon-blue); }

    .dock-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .btn-mic { background: rgba(56, 189, 248, 0.15); color: var(--neon-blue); border: 1px solid rgba(56, 189, 248, 0.3); }
    .btn-mic.recording { background: #EF4444; color: #FFF; animation: pulseRed 1s infinite; }
    @keyframes pulseRed { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .btn-send { background: var(--green); color: #000; font-weight: 800; }

    .order-card {
      background: #070D18;
      border: 1.5px solid var(--green);
      border-radius: 12px;
      padding: 12px;
      margin-top: 6px;
    }
    .btn-dispatch {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10B981;
      color: #000;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="install-banner" id="pwaBanner" style="display:none;">
    <span>📲 యాప్‌లా హోమ్ స్క్రీన్‌పై సేవ్ చేసుకోండి</span>
    <button class="btn-install" id="btnInstall">ADD TO SCREEN</button>
  </div>

  <header class="chat-header">
    <div class="brand-group">
      <svg class="bot-avatar" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#0284C7" opacity="0.3"/>
        <path d="M50 15 L80 28 V56 C80 74 50 90 50 90 C50 90 20 74 20 56 V28 Z" fill="#0B132B" stroke="#38BDF8" stroke-width="4"/>
        <circle cx="50" cy="45" r="14" fill="#10B981"/>
        <circle cx="50" cy="45" r="7" fill="#070D18"/>
        <circle cx="48" cy="43" r="2.5" fill="#38BDF8"/>
      </svg>
      <div class="bot-info">
        <h2>AVAILO OneChat 🦚</h2>
        <p><span class="status-dot"></span> ఆన్‌లైన్ (Live AI Assistant)</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="index.html">హోమ్ ➔</a>
    </div>
  </header>

  <div class="chat-body" id="chatStream">
    <div class="msg-row bot">
      <div class="bubble">
        నమస్కారం! నేను మీ <strong>అవైలో మయూరను 🦚</strong>.<br>
        మీకు ఏ సర్వీస్ కావాలో క్రింద ఎంచుకోండి లేదా టైప్ చేయండి:
        
        <div class="options-grid">
          <div class="opt-tile" onclick="chooseService('🛠️ హోమ్ రిపేర్స్ (Electrician/Plumber/AC)')">
            <span class="opt-icon">🛠️</span>
            <span class="opt-label">హోమ్ రిపేర్స్</span>
          </div>
          <div class="opt-tile" onclick="chooseService('🍽️ హోమ్‌మేడ్ ఫుడ్ & క్యాటరింగ్')">
            <span class="opt-icon">🍽️</span>
            <span class="opt-label">ఫుడ్ & క్యాటరింగ్</span>
          </div>
          <div class="opt-tile" onclick="chooseService('🛍️ కిరాణా & కూరగాయలు (Grocery)')">
            <span class="opt-icon">🛍️</span>
            <span class="opt-label">డైలీ కిరాణా</span>
          </div>
          <div class="opt-tile" onclick="chooseService('👵 NRI Parents Care Plans')">
            <span class="opt-icon">👵</span>
            <span class="opt-label">NRI పేరెంట్స్ కేర్</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-dock">
    <button class="dock-btn btn-mic" id="btnMic" onclick="toggleVoiceInput()">🎤</button>
    <input type="text" id="userInput" class="input-box" placeholder="మీకు ఏం కావాలో టైప్ చేయండి లేదా మాట్లాడండి..." onkeypress="handleEnter(event)">
    <button class="dock-btn btn-send" onclick="sendUserMessage()">➤</button>
  </div>

  <script>
    let selectedService = '';
    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'te-IN';

      recognition.onresult = (event) => {
        const voiceText = event.results[0][0].transcript;
        document.getElementById('userInput').value = voiceText;
        toggleVoiceInput();
        sendUserMessage();
      };
      recognition.onerror = () => { toggleVoiceInput(); };
      recognition.onend = () => { if(isRecording) toggleVoiceInput(); };
    }

    function toggleVoiceInput() {
      const micBtn = document.getElementById('btnMic');
      if (!recognition) {
        alert("మీ బ్రౌజర్ వాయిస్ రికార్డింగ్‌కు సపోర్ట్ చేయడం లేదు. దయచేసి టైప్ చేయండి.");
        return;
      }
      if (!isRecording) {
        recognition.start();
        isRecording = true;
        micBtn.classList.add('recording');
      } else {
        recognition.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    }

    function chooseService(srvName) {
      selectedService = srvName;
      addMessage(srvName, 'user');

      setTimeout(() => {
        let reply = "";
        if (srvName.includes('ఫుడ్')) {
          reply = "చాలా సంతోషం! మీకు <strong>డైలీ క్యారియర్ భోజనం</strong> కావాలా? లేదా <strong>ఫంక్షన్/పూజ కోసం భోజనం/టిఫిన్</strong> కావాలా? మీ అపార్ట్‌మెంట్ పేరు, ఫ్లాట్ నంబర్‌తో వివరాలు చెప్పండి.";
        } else if (srvName.includes('రిపేర్స్')) {
          reply = "తప్పకుండా! ఎలక్ట్రీషియన్, ప్లంబర్ లేదా AC రిపేరా? మీ సమస్య ఏంటో మరియు మీ ఫ్లాట్ నంబర్ ఇక్కడ చెప్పండి.";
        } else if (srvName.includes('కిరాణా')) {
          reply = "మీకు కావాల్సిన కిరాణా సరుకులు లేదా తాజా కూరగాయల లిస్ట్ ఇక్కడ టైప్ చేయండి లేదా మైక్ నొక్కి వాయిస్ ఇవ్వండి.";
        } else {
          reply = "విజయవాడ & గుంటూరులో ఉండే మీ తల్లిదండ్రుల కోసం కేర్ ప్లాన్ వివరాలు ఇక్కడ చెప్పండి.";
        }
        addBotReply(reply, true);
      }, 500);
    }

    function sendUserMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      setTimeout(() => {
        const confirmBox = `
          <div class="order-card">
            <strong style="color: #10B981;">✅ మీ ఆర్డర్ వివరాలు సిద్ధమయ్యాయి!</strong><br>
            <span style="font-size: 0.78rem; color: #CBD5E1;">కింది బటన్ నొక్కగానే మా స్థానిక కోఆర్డినేటర్‌కు మీ రిక్వెస్ట్ చేరుతుంది:</span>
            <a href="https://api.whatsapp.com/send?phone=919966157369&text=${encodeURIComponent('Hi Availo OneChat Order:\n- Service: ' + (selectedService || 'General') + '\n- Requirement: ' + text)}" target="_blank" class="btn-dispatch">
              🚀 వాట్సాప్‌లో కన్ఫర్మ్ చేయండి (Confirm Order)
            </a>
          </div>
        `;
        addBotReply("మీ వివరాలు అర్థమయ్యాయి! " + confirmBox, false);
      }, 700);
    }

    function addMessage(text, sender) {
      const stream = document.getElementById('chatStream');
      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;
      row.innerHTML = `<div class="bubble">${text}</div>`;
      stream.appendChild(row);
      stream.scrollTop = stream.scrollHeight;
    }

    function addBotReply(htmlText, speakOut) {
      const stream = document.getElementById('chatStream');
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.innerHTML = `<div class="bubble">${htmlText}</div>`;
      stream.appendChild(row);
      stream.scrollTop = stream.scrollHeight;

      if (speakOut && 'speechSynthesis' in window) {
        const cleanText = htmlText.replace(/<[^>]*>?/gm, '');
        const utt = new SpeechSynthesisUtterance(cleanText);
        utt.lang = 'te-IN';
        window.speechSynthesis.speak(utt);
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendUserMessage();
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwaBanner').style.display = 'flex';
    });

    document.getElementById('btnInstall').addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('pwaBanner').style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
