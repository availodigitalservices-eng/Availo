    /* AVAILO tap transitions (24 Nov 2026, Evargo-style, fast — under 200ms).

    a { transition: transform 120ms ease, opacity 120ms ease; }
    a:active { transform: scale(0.97); opacity: 0.92; }
    body { animation: availoPageFade 180ms ease-out both; }
    @keyframes availoPageFade { from { opacity: 0; } to { opacity: 1; } }

      a { transition: none; }
      body { animation: none; }
    }
  </style>

    // form now lives on the homepage (#gate-section). Old QR codes, bookmarks

    // ?apartment= QR parameter so the apartment still pre-fills.
    (function () {
      var q = window.location.search || '';
      window.location.replace('index.html' + q + '#gate-section');
    })();
  </script>
