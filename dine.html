<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVAILO SMART DINE - NEXT-GEN TABLE CONCIERGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rajdhani:wght@700;800&family=Ramabhadra&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-navy: #071426;
            --brand-cyan: #20DDE0;
            --brand-gold: #DDB65D;
            --card-bg: #0d223f;
            --text-light: #f8fafc;
            --accent-green: #16a34a;
            --veg-green: #22c55e;
            --nonveg-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--brand-navy);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            padding-bottom: 115px;
        }

        /* 1. TOP STAGE: AI VOICE CONCIERGE */
        .stage-box {
            background: radial-gradient(circle at 50% 20%, #0e2f57 0%, var(--brand-navy) 85%);
            border-bottom: 1.5px solid rgba(32, 221, 224, 0.3);
            padding: 16px 14px 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-meta-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 460px;
            margin-bottom: 10px;
        }

        .venue-pill {
            background: rgba(221, 182, 93, 0.15);
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 16px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.8px;
        }

        .live-clock-pill {
            background: rgba(32, 221, 224, 0.12);
            border: 1px solid rgba(32, 221, 224, 0.4);
            color: var(--brand-cyan);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 16px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Futuristic Voice Wave Core */
        .ai-voice-hub {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: rgba(32, 221, 224, 0.08);
            border: 2px solid var(--brand-cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 0 22px rgba(32, 221, 224, 0.25), inset 0 0 12px rgba(32, 221, 224, 0.2);
            margin-bottom: 10px;
            position: relative;
        }

        .ai-voice-hub::after {
            content: '';
            position: absolute;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 1px dashed rgba(32, 221, 224, 0.45);
            animation: spinRing 10s linear infinite;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .wave-bar {
            width: 4px;
            height: 14px;
            background: var(--brand-cyan);
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        .stage-box.speaking .wave-bar {
            animation: soundWave 0.35s infinite ease-in-out alternate;
        }

        .stage-box.speaking .wave-bar:nth-child(1) { animation-delay: 0.0s; }
        .stage-box.speaking .wave-bar:nth-child(2) { animation-delay: 0.12s; }
        .stage-box.speaking .wave-bar:nth-child(3) { animation-delay: 0.24s; }
        .stage-box.speaking .wave-bar:nth-child(4) { animation-delay: 0.08s; }
        .stage-box.speaking .wave-bar:nth-child(5) { animation-delay: 0.2s; }

        @keyframes soundWave {
            0% { height: 10px; background: var(--brand-cyan); }
            100% { height: 38px; background: var(--brand-gold); }
        }

        .supervisor-bubble {
            background: rgba(7, 20, 38, 0.95);
            border: 1.5px solid var(--brand-cyan);
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 9px;
            box-shadow: 0 4px 15px rgba(32, 221, 224, 0.2);
            width: 100%;
            max-width: 460px;
        }

        .sup-badge {
            background: var(--brand-cyan);
            color: #071426;
            font-size: 9.5px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .sup-voice-text {
            font-family: 'Ramabhadra', sans-serif;
            font-size: 13px;
            color: #fff;
            line-height: 1.3;
            text-align: left;
        }

        /* 2. CATEGORIES & SUB-CATEGORIES BAR */
        .content-wrap {
            padding: 12px 14px;
            max-width: 480px;
            margin: 0 auto;
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cat-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }

        .cat-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid rgba(32, 221, 224, 0.3);
            color: #cbd5e1;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Ramabhadra', sans-serif;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: var(--brand-cyan);
            color: #071426;
            border-color: var(--brand-cyan);
            box-shadow: 0 0 12px rgba(32, 221, 224, 0.4);
        }

        /* Sub-category / Diet Filter Pills */
        .sub-filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .diet-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .diet-pill.active {
            border-color: var(--brand-gold);
            color: var(--brand-gold);
            background: rgba(221, 182, 93, 0.12);
        }

        .dot-veg {
            width: 8px;
            height: 8px;
            background: var(--veg-green);
            border-radius: 50%;
            display: inline-block;
        }

        .dot-nonveg {
            width: 8px;
            height: 8px;
            background: var(--nonveg-red);
            border-radius: 50%;
            display: inline-block;
        }

        /* Menu Item Cards */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dish-row {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dish-badge-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .sub-tag {
            font-size: 9.5px;
            background: rgba(255,255,255,0.08);
            color: #94a3b8;
            padding: 1px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }

        .dish-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .dish-desc {
            font-size: 11.5px;
            color: #94a3b8;
        }

        .dish-cost {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: var(--brand-cyan);
            margin-top: 3px;
            display: inline-block;
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1.5px solid var(--brand-cyan);
            background: rgba(32, 221, 224, 0.1);
            color: var(--brand-cyan);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-val {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 800;
            min-width: 18px;
            text-align: center;
        }

        /* Chef Note Input */
        .chef-note-box {
            margin-top: 14px;
        }

        .chef-input {
            width: 100%;
            background: rgba(13, 34, 63, 0.8);
            border: 1px solid rgba(32, 221, 224, 0.35);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            font-family: 'Ramabhadra', sans-serif;
            outline: none;
        }

        /* 3. ORDER PAD SLIP + UNIQUE SPLIT BILL CALCULATOR */
        .order-book-container {
            margin-top: 18px;
            background: #fffdf5;
            border-radius: 8px;
            padding: 16px 14px;
            color: #1e293b;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-left: 6px solid #854d0e;
            position: relative;
        }

        .book-top-clip {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 10px;
            background: #475569;
            border-radius: 4px;
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px dashed #94a3b8;
            padding-bottom: 6px;
            margin-bottom: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 800;
            font-size: 13px;
            color: #334155;
        }

        .writing-lines {
            min-height: 65px;
            font-family: 'Caveat', cursive;
            font-size: 19px;
            color: #0f172a;
            line-height: 1.6;
        }

        .writing-line-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dotted #cbd5e1;
            padding: 2px 0;
        }

        .empty-hint {
            color: #94a3b8;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            text-align: center;
            padding: 18px 0;
            font-style: italic;
        }

        /* Unique Split Bill Bar */
        .split-bill-box {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #475569;
        }

        .split-btns {
            display: flex;
            gap: 4px;
        }

        .split-btn {
            background: #e2e8f0;
            border: none;
            border-radius: 4px;
            padding: 3px 7px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            color: #0f172a;
        }

        .split-btn.active {
            background: #0f172a;
            color: #fff;
        }

        /* 4. LIVE TRACKER & REFILLS */
        .tracker-card {
            background: #0d223f;
            border: 2px solid var(--brand-cyan);
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            margin-top: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .timer-box {
            background: rgba(7, 20, 38, 0.95);
            border: 1.5px solid var(--brand-gold);
            border-radius: 12px;
            padding: 12px;
            margin: 12px 0;
        }

        .timer-digits {
            font-family: 'Rajdhani', sans-serif;
            font-size: 40px;
            font-weight: 800;
            color: var(--brand-cyan);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0 6px;
        }

        .progress-fill {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, var(--brand-cyan), var(--accent-green));
            border-radius: 6px;
            transition: width 1s ease;
        }

        .progress-steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            margin: 12px 0;
            padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12.5px;
            color: #64748b;
            font-family: 'Ramabhadra', sans-serif;
        }

        .step-item.active {
            color: #ffffff;
            font-weight: 700;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #334155;
            border: 2px solid #475569;
            flex-shrink: 0;
        }

        .step-item.active .step-dot {
            background: var(--accent-green);
            border-color: #86efac;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .refill-section-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            color: var(--brand-gold);
            font-weight: 800;
            text-align: left;
            margin: 14px 0 8px;
            letter-spacing: 0.5px;
        }

        .quick-service-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .srv-btn {
            background: rgba(32, 221, 224, 0.1);
            border: 1px solid var(--brand-cyan);
            color: #ffffff;
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Ramabhadra', sans-serif;
        }

        .srv-btn.bill-btn {
            border-color: var(--brand-gold);
            color: var(--brand-gold);
            background: rgba(221, 182, 93, 0.1);
        }

        /* 5. BOTTOM BAR */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #050e1a;
            border-top: 1.5px solid rgba(32, 221, 224, 0.25);
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }

        .btn-speak {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid var(--brand-cyan);
            color: var(--brand-cyan);
            padding: 11px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Ramabhadra', sans-serif;
        }

        .btn-order {
            flex: 1.3;
            background: var(--accent-green);
            border: none;
            color: #ffffff;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- 1. AI Voice Concierge Stage -->
    <div id="voiceStage" class="stage-box">
        <div class="top-meta-bar">
            <div class="venue-pill" id="badgeText">AMARAVATI GRAND · TABLE 01</div>
            <div class="live-clock-pill" id="liveClock">--:--</div>
        </div>
        
        <div class="ai-voice-hub" onclick="speakGentVoice('నమస్కారం సర్! నేను అవైలో స్మార్ట్ కన్సీర్జ్. కింద ఉన్న కేటగిరీల నుండి మీకు నచ్చిన వంటకాలు ఎంచుకోండి.')">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <div class="supervisor-bubble">
            <span class="sup-badge">AVAILO AI</span>
            <span class="sup-voice-text" id="supervisorText">స్వాగతం సర్! కేటగిరీ ఎంచుకుని ఆర్డర్ చేయండి ✍️</span>
        </div>
    </div>

    <!-- 2. Dynamic Main Container -->
    <div class="content-wrap" id="mainContainer">
        
        <!-- Main Categories -->
        <div class="cat-scroll" id="categoryTabs">
            <button class="cat-chip active" onclick="selectCategory('ALL', this)">🍽️ అన్నీ (All)</button>
            <button class="cat-chip" onclick="selectCategory('STARTERS', this)">🍢 స్టార్టర్స్</button>
            <button class="cat-chip" onclick="selectCategory('BIRYANIS', this)">🍲 బిర్యానీలు</button>
            <button class="cat-chip" onclick="selectCategory('CURRIES_ROTIS', this)">🍛 కర్రీస్ & రోటీ</button>
            <button class="cat-chip" onclick="selectCategory('DRINKS', this)">🥤 డ్రింక్స్</button>
        </div>

        <!-- Sub-Categories (Diet Type Filter) -->
        <div class="sub-filter-bar">
            <button class="diet-pill active" id="diet_ALL" onclick="selectDiet('ALL')">అన్నీ</button>
            <button class="diet-pill" id="diet_VEG" onclick="selectDiet('VEG')"><span class="dot-veg"></span> Pure Veg</button>
            <button class="diet-pill" id="diet_NONVEG" onclick="selectDiet('NONVEG')"><span class="dot-nonveg"></span> Non-Veg</button>
        </div>

        <!-- Dynamic Menu Items Container -->
        <div class="items-list" id="menuItemsContainer"></div>

        <!-- Chef Special Instruction -->
        <div class="chef-note-box">
            <input type="text" id="chefNoteInput" class="chef-input" placeholder="✍️ చెఫ్‌కు ప్రత్యేక సూచన (ఉదా: కారం తక్కువ, వేడిగా పంపండి)...">
        </div>

        <!-- 3. LIVE ORDER PAD + SPLIT BILL CALCULATOR -->
        <div class="order-book-container">
            <div class="book-top-clip"></div>
            <div class="book-header">
                <span>📝 LIVE ORDER SLIP (KOT)</span>
                <span id="bookTableLabel">TABLE 01</span>
            </div>
            
            <div class="writing-lines" id="orderPadLines">
                <div class="empty-hint">పైన ఐటమ్స్ సెలెక్ట్ చేయండి, ఇక్కడ నోట్ అవుతాయి ✍️</div>
            </div>

            <div style="border-top: 1.5px dashed #94a3b8; padding-top: 8px; margin-top: 8px; display: flex; justify-content: space-between; font-weight: 800; font-family: 'Rajdhani', sans-serif;">
                <span>TOTAL BILL:</span>
                <span id="padTotalAmount" style="color: #16a34a; font-size: 17px;">₹0</span>
            </div>

            <!-- Unique Split Bill Feature -->
            <div class="split-bill-box">
                <span>👥 స్ప్లిట్ బిల్ (తలసరి): <strong id="splitAmountDisplay" style="color:#0f172a;">₹0</strong></span>
                <div class="split-btns">
                    <button class="split-btn active" onclick="setSplitCount(1, this)">1</button>
                    <button class="split-btn" onclick="setSplitCount(2, this)">2</button>
                    <button class="split-btn" onclick="setSplitCount(3, this)">3</button>
                    <button class="split-btn" onclick="setSplitCount(4, this)">4</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. Bottom Action Bar -->
    <div class="bottom-bar" id="bottomNavBar">
        <button class="btn-speak" onclick="listenToVoiceOrder()">
            <span>🎤</span> ఆర్డర్ చెప్పండి
        </button>
        <button class="btn-order" onclick="sendOrderWhatsApp()">
            <span>🛒</span> ఆర్డర్ పంపండి (<span id="cartCount">0</span>)
        </button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const hotelName = params.get('hotel') || "అమరావతి గ్రాండ్";
        const tableNumber = params.get('table') || "Table 01";
        const targetWhatsApp = params.get('desk') || "919966157369";

        document.getElementById('badgeText').innerText = `${hotelName.toUpperCase()} · ${tableNumber.toUpperCase()}`;
        document.getElementById('bookTableLabel').innerText = `${tableNumber.toUpperCase()}`;

        // Live Clock
        function updateLiveClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // 🌟 EASY TO EDIT RESTAURANT MENU (Categories & Sub-categories)
        const HOTEL_MENU = [
            // STARTERS
            { id: 'paneerTikka', cat: 'STARTERS', sub: 'Tandoori Starter', diet: 'VEG', name: 'పన్నీర్ టిక్కా (6 Pcs)', desc: 'బొగ్గుల మీద కాల్చిన పన్నీర్', price: 190, count: 0 },
            { id: 'crispyCorn', cat: 'STARTERS', sub: 'Crispy Snack', diet: 'VEG', name: 'క్రిస్పీ చిల్లీ కార్న్', desc: 'స్పైసీ స్వీట్ కార్న్ ఫ్రై', price: 150, count: 0 },
            { id: 'chicken65', cat: 'STARTERS', sub: 'Andhra Special', diet: 'NONVEG', name: 'చికెన్ 65 (Boneless)', desc: 'కరివేపాకు మసాలా ఫ్రై', price: 220, count: 0 },
            
            // BIRYANIS
            { id: 'vegDumBiryani', cat: 'BIRYANIS', sub: 'Hyderabadi Dum', diet: 'VEG', name: 'స్పెషల్ వెజ్ దమ్ బిర్యానీ', desc: 'మిర్చి కా సాలన్ & రైతా', price: 220, count: 0 },
            { id: 'kajuBiryani', cat: 'BIRYANIS', sub: 'Chef Special', diet: 'VEG', name: 'జీడిపప్పు (Kaju) బిర్యానీ', desc: 'నెయ్యిలో వేయించిన జీడిపప్పుతో', price: 260, count: 0 },
            { id: 'chickenDumBiryani', cat: 'BIRYANIS', sub: 'Signature Dish', diet: 'NONVEG', name: 'చికెన్ దమ్ బిర్యానీ', desc: 'అసలైన దమ్ మసాలా రుచి', price: 280, count: 0 },

            // CURRIES & ROTIS
            { id: 'paneerButter', cat: 'CURRIES_ROTIS', sub: 'Rich Gravy', diet: 'VEG', name: 'పన్నీర్ బట్టర్ మసాలా', desc: 'క్రీమీ టొమాటో & జీడిపప్పు గ్రేవీ', price: 180, count: 0 },
            { id: 'butterNaan', cat: 'CURRIES_ROTIS', sub: 'Tandoor Bread', diet: 'VEG', name: 'బట్టర్ నాన్ (2 Pcs)', desc: 'వేడి వేడి తందూరీ నాన్', price: 60, count: 0 },

            // DRINKS
            { id: 'sweetLassi', cat: 'DRINKS', sub: 'Coolers', diet: 'VEG', name: 'స్పెషల్ స్వీట్ లస్సీ', desc: 'చిక్కటి పెరుగు & బాదం పలుకులు', price: 70, count: 0 },
            { id: 'waterBottle', cat: 'DRINKS', sub: 'Beverages', diet: 'VEG', name: 'మినరల్ వాటర్ (1L)', desc: 'కూల్డ్ వాటర్ బాటిల్', price: 25, count: 0 }
        ];

        let currentCategory = 'ALL';
        let currentDiet = 'ALL';
        let splitCount = 1;
        let currentGrandTotal = 0;

        // Render Menu based on Category & Sub-category
        function renderMenu() {
            const listEl = document.getElementById('menuItemsContainer');
            const filtered = HOTEL_MENU.filter(item => {
                const matchCat = (currentCategory === 'ALL' || item.cat === currentCategory);
                const matchDiet = (currentDiet === 'ALL' || item.diet === currentDiet);
                return matchCat && matchDiet;
            });

            listEl.innerHTML = filtered.map(item => `
                <div class="dish-row">
                    <div>
                        <div class="dish-badge-row">
                            <span class="${item.diet === 'VEG' ? 'dot-veg' : 'dot-nonveg'}"></span>
                            <span class="sub-tag">${item.sub}</span>
                        </div>
                        <div class="dish-title">${item.name}</div>
                        <div class="dish-desc">${item.desc}</div>
                        <span class="dish-cost">₹${item.price}</span>
                    </div>
                    <div class="qty-box">
                        <button class="qty-btn" onclick="modifyItem('${item.id}', -1)">-</button>
                        <span class="qty-val">${item.count}</span>
                        <button class="qty-btn" onclick="modifyItem('${item.id}', 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function selectCategory(cat, btnEl) {
            currentCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            btnEl.classList.add('active');
            renderMenu();
        }

        function selectDiet(diet) {
            currentDiet = diet;
            document.querySelectorAll('.diet-pill').forEach(p => p.classList.remove('active'));
            document.getElementById(`diet_${diet}`).classList.add('active');
            renderMenu();
        }

        function getTimeGreeting() {
            const hr = new Date().getHours();
            if (hr < 12) return "శుభోదయం సర్!";
            if (hr < 17) return "శుభ మధ్యాహ్నం సర్!";
            return "శుభ సాయంత్రం సర్!";
        }

        function speakGentVoice(text) {
            document.getElementById('supervisorText').innerText = text;
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => (v.lang.includes('te') || v.lang.includes('en-IN')) && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('ravi') || v.name.toLowerCase().includes('pradeep')));
                
                if (maleVoice) utter.voice = maleVoice;

                utter.pitch = 0.76; 
                utter.rate = 0.94;
                utter.lang = 'te-IN';

                const stage = document.getElementById('voiceStage');
                stage.classList.add('speaking');

                utter.onend = () => stage.classList.remove('speaking');
                utter.onerror = () => stage.classList.remove('speaking');

                window.speechSynthesis.speak(utter);
            }
        }

        window.addEventListener('load', () => {
            renderMenu();
            setTimeout(() => {
                const greet = getTimeGreeting();
                speakGentVoice(`${greet} ${hotelName} కు హృదయపూర్వక స్వాగతం. మీరు ${tableNumber} లో ఉన్నారు. మెనూ నుండి మీకు నచ్చినవి ఎంచుకోండి సర్.`);
            }, 600);
        });

        function modifyItem(id, delta) {
            const item = HOTEL_MENU.find(i => i.id === id);
            if (item) {
                item.count = Math.max(0, item.count + delta);
                renderMenu();
                renderOrderPad();

                if (delta > 0) {
                    const prompts = [
                        `సరే సర్, ${item.name} నోట్ చేసుకున్నాను. నెక్స్ట్ ఏం కావాలి సర్?`,
                        `${item.name} యాడ్ చేశాను సర్.. ఇంకేమైనా కావాలా?`,
                        `రైట్ సర్, రాసుకున్నాను..`
                    ];
                    speakGentVoice(prompts[Math.floor(Math.random() * prompts.length)]);
                }
            }
        }

        function setSplitCount(num, btnEl) {
            splitCount = num;
            document.querySelectorAll('.split-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            updateSplitDisplay();
        }

        function updateSplitDisplay() {
            const perHead = splitCount > 0 ? Math.ceil(currentGrandTotal / splitCount) : currentGrandTotal;
            document.getElementById('splitAmountDisplay').innerText = `₹${perHead}`;
        }

        function renderOrderPad() {
            const padContainer = document.getElementById('orderPadLines');
            let linesHtml = "";
            let total = 0;
            let totalCount = 0;

            HOTEL_MENU.forEach(item => {
                if (item.count > 0) {
                    const itemTotal = item.count * item.price;
                    total += itemTotal;
                    totalCount += item.count;
                    linesHtml += `
                        <div class="writing-line-item">
                            <span>✍️ ${item.name} x ${item.count}</span>
                            <span>₹${itemTotal}</span>
                        </div>
                    `;
                }
            });

            currentGrandTotal = total;

            if (linesHtml === "") {
                padContainer.innerHTML = `<div class="empty-hint">పైన ఐటమ్స్ సెలెక్ట్ చేయండి, ఇక్కడ నోట్ అవుతాయి ✍️</div>`;
            } else {
                padContainer.innerHTML = linesHtml;
            }

            document.getElementById('padTotalAmount').innerText = `₹${total}`;
            document.getElementById('cartCount').innerText = totalCount;
            updateSplitDisplay();
        }

        function listenToVoiceOrder() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("వాయిస్ రికగ్నిషన్ కోసం Chrome వాడండి.");
                return;
            }
            const rec = new SpeechRec();
            rec.lang = 'te-IN';
            rec.onstart = () => {
                document.getElementById('supervisorText').innerText = "🔴 వింటున్నాను సర్, మీ ఆర్డర్ చెప్పండి...";
            };
            rec.onresult = (e) => {
                const spokenText = e.results[0][0].transcript;
                speakGentVoice(`రాసుకున్నాను సర్: ${spokenText}`);
                
                const msg = `*AVAILO SMART DINE - VOICE ORDER*%0A-----------------------------%0A*హోటల్:* ${hotelName}%0A*టేబుల్:* ${tableNumber}%0A*వాయిస్ ఆర్డర్:* ${spokenText}%0A-----------------------------%0A_(కిచెన్ ప్రిపరేషన్ అయ్యాక ఇదే చాట్‌లో కస్టమర్‌కు రిప్లై ఇవ్వండి)_`;
                displayLiveTrackerScreen("Voice Order", 15);
                setTimeout(() => {
                    window.location.href = `https://wa.me/${targetWhatsApp}?text=${msg}`;
                }, 1200);
            };
            rec.start();
        }

        function sendOrderWhatsApp() {
            let orderLines = [];
            let grandTotal = 0;

            HOTEL_MENU.forEach(item => {
                if (item.count > 0) {
                    const cost = item.count * item.price;
                    orderLines.push(`• ${item.name} x ${item.count} = ₹${cost}`);
                    grandTotal += cost;
                }
            });

            if (orderLines.length === 0) {
                speakGentVoice("ఒక్క ఐటమ్ అయినా సెలెక్ట్ చేయండి సర్, ఆర్డర్ పంపిస్తాను.");
                return;
            }

            const chefNote = document.getElementById('chefNoteInput').value.trim();
            const noteStr = chefNote ? `%0A*చెఫ్ సూచన:* ${chefNote}` : "";

            const itemsStr = orderLines.join('%0A');
            const msg = `*AVAILO LIVE KOT (ఆర్డర్ స్లిప్)*%0A-----------------------------%0A*హోటల్:* ${hotelName}%0A*టేబుల్:* ${tableNumber}%0A-----------------------------%0A${itemsStr}${noteStr}%0A-----------------------------%0A*మొత్తం బిల్లు:* ₹${grandTotal}%0A*సమయం:* ${new Date().toLocaleTimeString()}%0A-----------------------------%0A🔔 *కిచెన్ సూచన:* ఆర్డర్ రెడీ అయ్యాక ఇదే కస్టమర్ వాట్సాప్ కు "ఆర్డర్ రెడీ సర్" అని రిప్లై పంపండి.`;

            displayLiveTrackerScreen(`₹${grandTotal}`, 15);

            setTimeout(() => {
                window.location.href = `https://wa.me/${targetWhatsApp}?text=${msg}`;
            }, 1400);
        }

        function requestTableService(itemLabel, voiceReply) {
            speakGentVoice(voiceReply);
            const msg = `*AVAILO TABLE REFILL / SERVICE*%0A-----------------------------%0A*హోటల్:* ${hotelName}%0A*టేబుల్:* ${tableNumber}%0A*కావలసినవి:* ${itemLabel}%0A*సమయం:* ${new Date().toLocaleTimeString()}`;
            setTimeout(() => {
                window.location.href = `https://wa.me/${targetWhatsApp}?text=${msg}`;
            }, 900);
        }

        function displayLiveTrackerScreen(billInfo, minutes) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="tracker-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-size: 12px; color: var(--brand-gold); font-family: 'Rajdhani', sans-serif; font-weight: 800;">LIVE ORDER TRACKER</span>
                        <span style="font-size: 12px; color: var(--brand-cyan); font-family: 'Rajdhani', sans-serif; font-weight: 800;" id="progressPercent">35% COMPLETED</span>
                    </div>
                    
                    <div class="progress-track">
                        <div class="progress-fill" id="progressBarFill"></div>
                    </div>

                    <div class="timer-box">
                        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 2px;">అంచనా సమయం (ESTIMATED DELIVERY)</div>
                        <div class="timer-digits" id="liveTimer">${minutes}:00</div>
                        <div style="font-size: 12.5px; color: var(--accent-green); font-weight: 700; margin-top: 4px;">మొత్తం బిల్లు: ${billInfo}</div>
                    </div>

                    <div class="progress-steps">
                        <div class="step-item active" id="step1">
                            <div class="step-dot"></div>
                            <span>1. ఆర్డర్ కిచెన్‌కు చేరింది (Order Received)</span>
                        </div>
                        <div class="step-item active" id="step2">
                            <div class="step-dot"></div>
                            <span>2. చెఫ్ తయారు చేస్తున్నారు (Preparing Food...)</span>
                        </div>
                        <div class="step-item" id="step3">
                            <div class="step-dot"></div>
                            <span>3. టేబుల్ వద్దకు వస్తోంది (Ready to Serve)</span>
                        </div>
                    </div>

                    <div class="refill-section-title">⚡ తక్షణ అవసరాలు / రీఫిల్స్ (ONE-TAP REFILLS):</div>
                    <div class="quick-service-grid">
                        <button class="srv-btn" onclick="requestTableService('ఉల్లిపాయలు & నిమ్మకాయ (Onions & Lemon)', 'ఉల్లిపాయలు, నిమ్మకాయ పంపించమని కిచెన్‌కు చెప్తున్నాను సర్.')">🧅 ఉల్లిపాయ & నిమ్మకాయ</button>
                        <button class="srv-btn" onclick="requestTableService('పెరుగు / రైతా (Extra Curd / Raita)', 'ఎక్స్‌ట్రా పెరుగు పంపించమని చెప్తున్నాను సర్.')">🥣 పెరుగు / రైతా</button>
                        <button class="srv-btn" onclick="requestTableService('మంచినీళ్లు (Drinking Water)', 'మంచినీళ్లు పంపిస్తున్నాము సర్.')">💧 మంచినీళ్లు (Water)</button>
                        <button class="srv-btn" onclick="requestTableService('టిష్యూ పేపర్స్ / సాల్ట్ (Tissues & Salt)', 'టిష్యూ పేపర్స్ పంపిస్తున్నాము సర్.')">🧻 టిష్యూ పేపర్స్</button>
                        <button class="srv-btn" onclick="requestTableService('AC కూలింగ్ అడ్జస్ట్ చేయండి (Adjust AC)', 'AC టెంపరేచర్ అడ్జస్ట్ చేయమని స్టాఫ్‌కు చెప్తున్నాను సర్.')">❄️ AC అడ్జస్ట్ చేయండి</button>
                        <button class="srv-btn bill-btn" onclick="requestTableService('బిల్లు పంపండి (Request Final Bill)', 'మీ టేబుల్ బిల్లు సిద్ధం చేయమని కౌంటర్‌కు చెప్తున్నాను సర్.')">🧾 బిల్లు పంపండి</button>
                    </div>
                </div>
            `;

            document.getElementById('bottomNavBar').innerHTML = `
                <button onclick="location.reload()" style="width: 100%; background: var(--brand-cyan); color: #071426; border: none; padding: 13px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: 'Rajdhani', sans-serif;">
                    🔄 ఇంకా ఏమైనా ఫుడ్ ఆర్డర్ చేయండి (ADD MORE FOOD)
                </button>
            `;

            speakGentVoice(`థాంక్యూ సర్! మీ ఆర్డర్ కిచెన్‌కు వెళ్ళింది. పదిహేను నిమిషాల్లో వేడి వేడిగా మీ టేబుల్ వద్దకు వస్తుంది. మధ్యలో ఉల్లిపాయలు, నిమ్మకాయ, పెరుగు లేదా AC అడ్జస్ట్‌మెంట్ కోసం కింద బటన్లు వాడుకోండి సర్.`);
            startCountdown(minutes * 60);
        }

        function startCountdown(durationInSeconds) {
            const totalDuration = durationInSeconds;
            let timer = durationInSeconds;
            const display = document.getElementById('liveTimer');
            const barFill = document.getElementById('progressBarFill');
            const percentText = document.getElementById('progressPercent');
            
            const interval = setInterval(() => {
                if (!display) {
                    clearInterval(interval);
                    return;
                }
                let mins = Math.floor(timer / 60);
                let secs = timer % 60;
                mins = mins < 10 ? "0" + mins : mins;
                secs = secs < 10 ? "0" + secs : secs;
                
                display.textContent = mins + ":" + secs;

                const elapsed = totalDuration - timer;
                const pct = Math.min(100, Math.max(35, Math.round((elapsed / totalDuration) * 100)));
                if (barFill) barFill.style.width = pct + "%";
                if (percentText) percentText.textContent = pct + "% COMPLETED";

                if (timer <= 120) {
                    const step3 = document.getElementById('step3');
                    if (step3) step3.classList.add('active');
                }

                if (--timer < 0) {
                    clearInterval(interval);
                    display.textContent = "READY!";
                    if (percentText) percentText.textContent = "100% READY TO SERVE";
                }
            }, 1000);
        }
    </script>
