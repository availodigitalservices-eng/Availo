<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVAILO SMART DINE - VOICE & LIVE TRACKER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rajdhani:wght@700;800&family=Ramabhadra&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-navy: #071426;
            --brand-cyan: #20DDE0;
            --brand-gold: #DDB65D;
            --card-bg: #0d223f;
            --text-light: #f8fafc;
            --accent-green: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--brand-navy);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            padding-bottom: 110px;
        }

        /* 1. TOP STAGE: FUTURISTIC AI VOICE HUB */
        .stage-box {
            background: radial-gradient(circle at 50% 25%, #0e2f57 0%, var(--brand-navy) 85%);
            border-bottom: 1.5px solid rgba(32, 221, 224, 0.3);
            padding: 20px 14px 18px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .venue-pill {
            background: rgba(221, 182, 93, 0.15);
            border: 1px solid var(--brand-gold);
            color: var(--brand-gold);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 16px;
            margin-bottom: 14px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
        }

        .ai-voice-hub {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(32, 221, 224, 0.08);
            border: 2px solid var(--brand-cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(32, 221, 224, 0.25), inset 0 0 15px rgba(32, 221, 224, 0.2);
            margin-bottom: 14px;
            position: relative;
            transition: all 0.3s ease;
        }

        .ai-voice-hub::after {
            content: '';
            position: absolute;
            width: 126px;
            height: 126px;
            border-radius: 50%;
            border: 1px dashed rgba(32, 221, 224, 0.4);
            animation: spinRing 12s linear infinite;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .wave-bar {
            width: 5px;
            height: 18px;
            background: var(--brand-cyan);
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        .stage-box.speaking .wave-bar {
            animation: soundWave 0.4s infinite ease-in-out alternate;
        }

        .stage-box.speaking .wave-bar:nth-child(1) { animation-delay: 0.0s; }
        .stage-box.speaking .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .stage-box.speaking .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .stage-box.speaking .wave-bar:nth-child(4) { animation-delay: 0.1s; }
        .stage-box.speaking .wave-bar:nth-child(5) { animation-delay: 0.25s; }

        @keyframes soundWave {
            0% { height: 14px; background: var(--brand-cyan); }
            100% { height: 48px; background: var(--brand-gold); }
        }

        .supervisor-bubble {
            background: rgba(7, 20, 38, 0.95);
            border: 1.5px solid var(--brand-cyan);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(32, 221, 224, 0.2);
            max-width: 92%;
        }

        .sup-badge {
            background: var(--brand-cyan);
            color: #071426;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .sup-voice-text {
            font-family: 'Ramabhadra', sans-serif;
            font-size: 13.5px;
            color: #fff;
            line-height: 1.35;
            text-align: left;
        }

        /* 2. MENU ITEMS */
        .content-wrap {
            padding: 14px;
            max-width: 480px;
            margin: 0 auto;
        }

        .menu-header {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            color: var(--brand-gold);
            font-weight: 800;
            margin: 8px 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dish-row {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
