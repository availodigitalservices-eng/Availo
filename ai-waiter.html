<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVAILO AI WAITER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rajdhani:wght@700;800&family=Ramabhadra&family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #071426;
            --card-bg: #0d223f;
            --cyan: #20DDE0;
            --gold: #DDB65D;
            --green: #22c55e;
            --accent-green: #16a34a;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #103563 0%, var(--bg-dark) 85%);
            color: var(--text-main);
            font-family: 'Inter', 'Ramabhadra', 'Noto Sans Devanagari', sans-serif;
            min-height: 100vh;
            padding: 14px 14px 115px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* 1. TOP HEADER */
        .brand-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(32, 221, 224, 0.25);
            margin-bottom: 14px;
        }

        .brand-title-wrap {
            text-align: left;
        }

        .brand-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 21px;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .brand-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--green);
            color: var(--green);
            font-family: 'Rajdhani', sans-serif;
            font-size: 10.5px;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            animation: blinkDot 1.4s infinite;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .api-cfg-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(32, 221, 224, 0.35);
            color: var(--cyan);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. PREMIUM AI VOICE ORB STAGE (NO CARTOON) */
        .host-stage {
            width: 100%;
            background: linear-gradient(165deg, #0e2c54 0%, #071426 100%);
            border: 1.5px solid rgba(32, 221, 224, 0.5);
            border-radius: 20px;
            padding: 18px 14px 14px;
            margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(32, 221, 224, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .voice-orb-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .orb-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--cyan);
            opacity: 0.45;
            transition: all 0.3s ease;
        }

        .orb-core {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #20DDE0, #0284c7, #0f172a);
            box-shadow: 0 0 24px rgba(32, 221, 224, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .eq-bar {
            width: 4px;
            height: 14px;
            background: #ffffff;
            border-radius: 4px;
            transition: height 0.15s ease;
        }

        /* Speaking Animation */
        .host-stage.speaking .orb-ring {
            animation: rippleRing 1.2s infinite ease-out;
            border-color: var(--gold);
        }

        .host-stage.speaking .orb-core {
            box-shadow: 0 0 35px rgba(32, 221, 224, 0.9);
        }

        .host-stage.speaking .eq-bar:nth-child(1) { animation: eqWave 0.4s infinite alternate; }
        .host-stage.speaking .eq-bar:nth-child(2) { animation: eqWave 0.25s infinite alternate 0.1s; }
        .host-stage.speaking .eq-bar:nth-child(3) { animation: eqWave 0.35s infinite alternate 0.2s; }
        .host-stage.speaking .eq-bar:nth-child(4) { animation: eqWave 0.28s infinite alternate 0.05s; }
        .host-stage.speaking .eq-bar:nth-child(5) { animation: eqWave 0.42s infinite alternate 0.15s; }

        @keyframes rippleRing {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.38); opacity: 0; }
        }

        @keyframes eqWave {
            0% { height: 10px; }
            100% { height: 34px; }
        }

        .tap-hint {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .speech-caption {
            background: rgba(7, 20, 38, 0.92);
            border: 1px solid rgba(32, 221, 224, 0.35);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 13.5px;
            color: #ffffff;
            line-height: 1.5;
            width: 100%;
        }

        /* 3. LANGUAGE SELECTOR */
        .lang-section {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 11px;
            margin-bottom: 14px;
        }

        .section-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .lang-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(32, 221, 224, 0.25);
            color: #e2e8f0;
            padding: 8px 6px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .lang-pill.active {
            background: var(--cyan);
            color: #071426;
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(32, 221, 224, 0.4);
        }

        /* 4. MENU LIST */
        .menu-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 9px;
            text-align: left;
        }

        .dish-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 11px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dish-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .dish-desc {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .dish-price {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15.5px;
            font-weight: 800;
            color: var(--cyan);
            margin-top: 2px;
            display: inline-block;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .q-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1.5px solid var(--cyan);
            background: rgba(32, 221, 224, 0.1);
            color: var(--cyan);
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
        }

        .q-num {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 800;
            min-width: 16px;
            text-align: center;
        }

        /* 5. BOTTOM ACTION BAR */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #050e1a;
            border-top: 1.5px solid rgba(32, 221, 224, 0.25);
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 900;
        }

        .dock-inner {
            width: 100%;
            max-width: 440px;
            display: flex;
            gap: 10px;
        }

        .btn-voice {
            flex: 1;
            background: rgba(32, 221, 224, 0.12);
            border: 1.5px solid var(--cyan);
            color: var(--cyan);
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-send-order {
            flex: 1.3;
            background: var(--accent-green);
            border: none;
            color: #ffffff;
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-bar {
            margin-top: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .footer-bar span {
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- 1. Top Header -->
        <div class="brand-header">
            <div class="brand-title-wrap">
                <div class="brand-name">AVAILO</div>
                <div class="brand-sub">AI VOICE WAITER</div>
            </div>
            <div class="header-right">
                <div class="online-badge">
                    <span class="pulse-dot"></span> LIVE VOICE
                </div>
                <button class="api-cfg-btn" onclick="configureSarvamKey()" title="Sarvam API Key">⚙️</button>
            </div>
        </div>

        <!-- 2. Clean AI Voice Visualizer Stage -->
        <div class="host-stage" id="hostStage" onclick="speakWelcome()">
            <div class="voice-orb-wrap">
                <div class="orb-ring"></div>
                <div class="orb-core">
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                </div>
            </div>
            <div class="tap-hint" id="tapHintText">● వినడానికి ఇక్కడ ట్యాప్ చేయండి</div>

            <div class="speech-caption" id="hostCaption">
                "నమస్కారం! AVAILO Dine కి స్వాగతం. నన్ను ట్యాప్ చేసి మాట్లాడండి లేదా కింద మెనూ ఎంచుకోండి."
            </div>
        </div>

        <!-- 3. Language Selector -->
        <div class="lang-section">
            <span class="section-label">Choose Your Language</span>
            <div class="lang-grid">
                <button class="lang-pill active" onclick="switchLang('te', this)">తెలుగు</button>
                <button class="lang-pill" onclick="switchLang('en', this)">English</button>
                <button class="lang-pill" onclick="switchLang('hi', this)">हिन्दी</button>
            </div>
        </div>

        <!-- 4. Menu List -->
        <div class="menu-header">
            <span id="menuLabel">మెనూ ఎంచుకోండి</span>
            <span id="totalCostBadge" style="color: var(--cyan);">₹0</span>
        </div>

        <div class="menu-list" id="menuContainer"></div>

        <!-- 5. Footer -->
        <div class="footer-bar">
            Table No: <span id="tableNumber">01</span> · Powered by <span>AVAILO</span>
        </div>
    </div>

    <!-- 6. Bottom Bar -->
    <div class="bottom-dock">
        <div class="dock-inner">
            <button class="btn-voice" onclick="startVoiceRecognition()">
                <span>🎤</span> <span id="micBtnText">మాట్లాడి ఆర్డర్ చేయండి</span>
            </button>
            <button class="btn-send-order" onclick="sendWhatsAppOrder()">
                <span>🛒</span> <span id="orderBtnText">ఆర్డర్ పంపండి</span> (<span id="cartCount">0</span>)
            </button>
        </div>
    </div>

    <script>
        const DEFAULT_SARVAM_KEY = "YOUR_SARVAM_API_KEY_HERE";

        function getSarvamKey() {
            const saved = localStorage.getItem('availo_sarvam_key');
            if (saved && saved.trim() !== "") return saved.trim();
            return DEFAULT_SARVAM_KEY;
        }

        function configureSarvamKey() {
            const current = localStorage.getItem('availo_sarvam_key') || "";
            const userKey = prompt("మీ Sarvam AI API Key ఇక్కడ పేస్ట్ చేయండి:", current);
            if (userKey !== null) {
                localStorage.setItem('availo_sarvam_key', userKey.trim());
                alert("Sarvam AI Key సేవ్ అయింది!");
                speakWelcome();
            }
        }

        // URL నుండి కేవలం స్వచ్ఛమైన నంబర్ మాత్రమే తీసుకునేలా శానిటైజ్ చేశాము
        const urlParams = new URLSearchParams(window.location.search);
        const rawTable = urlParams.get('table') || "01";
        const cleanDigits = rawTable.replace(/[^0-9]/g, '');
        const tableParam = cleanDigits ? cleanDigits.slice(0, 3) : "01";

        const hotelParam = urlParams.get('hotel');
        const kitchenWa = (urlParams.get('desk') || "919966157369").replace(/[^0-9]/g, '');

        document.getElementById('tableNumber').innerText = tableParam;

        let currentLang = 'te';
        let currentAudio = null;

        const LANG_CONFIG = {
            te: {
                code: "te-IN",
                speaker: "anushka",
                hotel: hotelParam || "అమరావతి గ్రాండ్",
                tapHint: "● వాయిస్ వినడానికి ఇక్కడ ట్యాప్ చేయండి",
                welcome: `నమస్కారం! ${hotelParam || "అమరావతి గ్రాండ్"} కి స్వాగతం. మీరు టేబుల్ నంబర్ ${tableParam} లో ఉన్నారు. మీకు ఏం కావాలో చెప్పండి లేదా కింద మెనూలో ఎంచుకోండి.`,
                menuLbl: "మెనూ ఎంచుకోండి (TOUCH MENU)",
                micBtn: "మాట్లాడి ఆర్డర్ చేయండి",
                orderBtn: "ఆర్డర్ పంపండి",
                listening: "🔴 వింటున్నాను... మీకు ఏం కావాలో చెప్పండి...",
                addedMsg: (name) => `${name} ఆర్డర్‌లో చేర్చాను. ఇంకా ఏం కావాలి?`,
                emptyWarn: "దయచేసి ముందుగా కనీసం ఒక ఐటమ్ ఎంచుకోండి సర్."
            },
            en: {
                code: "en-IN",
                speaker: "anushka",
                hotel: hotelParam || "Amaravati Grand",
                tapHint: "● TAP HERE TO HEAR AI VOICE",
                welcome: `Welcome to ${hotelParam || "Amaravati Grand"}! You are at Table ${tableParam}. Tell me what you would like to order or select from the menu below.`,
                menuLbl: "SELECT DISHES (TOUCH MENU)",
                micBtn: "Voice Order",
                orderBtn: "Send Order",
                listening: "🔴 Listening... Please say your order...",
                addedMsg: (name) => `Added ${name} to your order. Anything else?`,
                emptyWarn: "Please select at least one item from the menu first."
            },
            hi: {
                code: "hi-IN",
                speaker: "anushka",
                hotel: hotelParam || "अमरावती ग्रैंड",
                tapHint: "● आवाज़ सुनने के लिए यहाँ टैप करें",
                welcome: `नमस्ते! ${hotelParam || "अमरावती ग्रैंड"} में आपका स्वागत है। आप टेबल नंबर ${tableParam} पर हैं। कृपया अपना ऑर्डर बोलें या नीचे मेनू से चुनें।`,
                menuLbl: "मेनू चुनें (TOUCH MENU)",
                micBtn: "बोलकर ऑर्डर करें",
                orderBtn: "ऑर्डर भेजें",
                listening: "🔴 सुन रहा हूँ... कृपया अपना ऑर्डर बोलें...",
                addedMsg: (name) => `${name} ऑर्डर में जोड़ दिया गया है। और क्या चाहिए?`,
                emptyWarn: "कृपया पहले मेनू से कम से कम एक आइटम चुनें।"
            }
        };

        const MENU = [
            { id: 'biryani', price: 220, count: 0, names: { te: 'స్పెషల్ వెజ్ దమ్ బిర్యానీ', en: 'Special Veg Dum Biryani', hi: 'स्पेशल वेज दम बिरयानी' }, desc: { te: 'రైతా & మిర్చి కా సాలన్', en: 'With Raita & Salan', hi: 'रायता और सालन के साथ' }, keys: ['బిర్యానీ', 'వెజ్ బిర్యానీ', 'biryani', 'बिरयानी'] },
            { id: 'chickenBiryani', price: 280, count: 0, names: { te: 'చికెన్ దమ్ బిర్యానీ', en: 'Chicken Dum Biryani', hi: 'चिकन दम बिरयानी' }, desc: { te: 'అసలైన హైదరాబాదీ రుచి', en: 'Authentic Hyderabadi Dum', hi: 'असली दम मसाला स्वाद' }, keys: ['చికెన్', 'chicken', 'चिकन'] },
            { id: 'dosa', price: 80, count: 0, names: { te: 'మసాలా దోశ', en: 'Masala Dosa', hi: 'मसाला डोसा' }, desc: { te: 'చట్నీ & సాంబార్‌తో', en: 'Crispy dosa with chutney', hi: 'चटनी और सांभर के साथ' }, keys: ['దోశ', 'దోస', 'dosa', 'डोसा'] },
            { id: 'coffee', price: 40, count: 0, names: { te: 'ఫిల్టర్ కాఫీ', en: 'Filter Coffee', hi: 'फ़िल्टर कॉफ़ी' }, desc: { te: 'సంప్రదాయ సౌత్ ఇండియన్ కాఫీ', en: 'Traditional South Indian', hi: 'साउथ इंडियन फ़िल्टर कॉफ़ी' }, keys: ['కాఫీ', 'coffee', 'कॉफ़ी'] }
        ];

        async function speakWithSarvam(text) {
            document.getElementById('hostCaption').innerText = `"${text}"`;
            const stage = document.getElementById('hostStage');

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const apiKey = getSarvamKey();
            if (!apiKey || apiKey === "YOUR_SARVAM_API_KEY_HERE") {
                fallbackBrowserSpeak(text);
                return;
            }

            try {
                stage.classList.add('speaking');
                const response = await fetch("https://api.sarvam.ai/text-to-speech", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "api-subscription-key": apiKey
                    },
                    body: JSON.stringify({
                        inputs: [text],
                        target_language_code: LANG_CONFIG[currentLang].code,
                        speaker: LANG_CONFIG[currentLang].speaker,
                        pace: 1.0,
                        speech_sample_rate: 16000,
                        enable_preprocessing: true,
                        model: "bulbul:v2"
                    })
                });

                const data = await response.json();
                if (data && data.audios && data.audios[0]) {
                    const audioSrc = "data:audio/wav;base64," + data.audios[0];
                    currentAudio = new Audio(audioSrc);
                    currentAudio.onended = () => stage.classList.remove('speaking');
                    currentAudio.onerror = () => stage.classList.remove('speaking');
                    await currentAudio.play();
                } else {
                    stage.classList.remove('speaking');
                    fallbackBrowserSpeak(text);
                }
            } catch (err) {
                stage.classList.remove('speaking');
                fallbackBrowserSpeak(text);
            }
        }

        function fallbackBrowserSpeak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = LANG_CONFIG[currentLang].code;
                const stage = document.getElementById('hostStage');
                stage.classList.add('speaking');
                utter.onend = () => stage.classList.remove('speaking');
                utter.onerror = () => stage.classList.remove('speaking');
                window.speechSynthesis.speak(utter);
            }
        }

        function speakWelcome() {
            speakWithSarvam(LANG_CONFIG[currentLang].welcome);
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = MENU.map(item => `
                <div class="dish-card">
                    <div>
                        <div class="dish-name">${item.names[currentLang]}</div>
                        <div class="dish-desc">${item.desc[currentLang]}</div>
                        <span class="dish-price">₹${item.price}</span>
                    </div>
                    <div class="qty-controls">
                        <button class="q-btn" onclick="changeQty('${item.id}', -1)">-</button>
                        <span class="q-num">${item.count}</span>
                        <button class="q-btn" onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                </div>
            `).join('');
            updateCart();
        }

        function switchLang(lang, el) {
            currentLang = lang;
            document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            document.getElementById('tapHintText').innerText = LANG_CONFIG[lang].tapHint;
            document.getElementById('menuLabel').innerText = LANG_CONFIG[lang].menuLbl;
            document.getElementById('micBtnText').innerText = LANG_CONFIG[lang].micBtn;
            document.getElementById('orderBtnText').innerText = LANG_CONFIG[lang].orderBtn;

            renderMenu();
            speakWelcome();
        }

        function changeQty(id, delta) {
            const item = MENU.find(i => i.id === id);
            if (!item) return;
            item.count = Math.max(0, item.count + delta);
            renderMenu();
            if (delta > 0) {
                speakWithSarvam(LANG_CONFIG[currentLang].addedMsg(item.names[currentLang]));
            }
        }

        function updateCart() {
            let qty = 0;
            let total = 0;
            MENU.forEach(i => {
                qty += i.count;
                total += i.count * i.price;
            });
            document.getElementById('cartCount').innerText = qty;
            document.getElementById('totalCostBadge').innerText = `₹${total}`;
        }

        function startVoiceRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("Voice recognition works best in Chrome.");
                return;
            }
            const rec = new SpeechRec();
            rec.lang = LANG_CONFIG[currentLang].code;

            rec.onstart = () => {
                document.getElementById('hostCaption').innerText = LANG_CONFIG[currentLang].listening;
            };

            rec.onresult = (e) => {
                const text = e.results[0][0].transcript.toLowerCase();
                let qty = 1;
                if (text.includes('రెండు') || text.includes('two') || text.includes('दो') || text.includes('2')) qty = 2;
                if (text.includes('మూడు') || text.includes('three') || text.includes('तीन') || text.includes('3')) qty = 3;

                let matched = false;
                MENU.forEach(item => {
                    if (item.keys.some(k => text.includes(k))) {
                        item.count += qty;
                        matched = true;
                    }
                });

                renderMenu();
                if (matched) {
                    speakWithSarvam(`"${text}" — మీ ఆర్డర్‌లో యాడ్ చేశాను. ఇంకా ఏం కావాలి?`);
                } else {
                    speakWithSarvam(`మీరు "${text}" అన్నారు. కింద మెనూలో కూడా ఎంచుకోవచ్చు.`);
                }
            };

            rec.start();
        }

        function sendWhatsAppOrder() {
            const selected = MENU.filter(i => i.count > 0);
            if (selected.length === 0) {
                speakWithSarvam(LANG_CONFIG[currentLang].emptyWarn);
                return;
            }
            let total = 0;
            const itemsStr = selected.map(i => {
                const cost = i.count * i.price;
                total += cost;
                return `• ${i.names.en} (${i.names.te}) x ${i.count} = ₹${cost}`;
            }).join('%0A');

            const msg = `*AVAILO AI VOICE WAITER - ORDER*%0A-----------------------------%0A*Restaurant:* ${LANG_CONFIG.en.hotel}%0A*Table No:* ${tableParam}%0A*Language:* ${currentLang.toUpperCase()}%0A-----------------------------%0A${itemsStr}%0A-----------------------------%0A*Total Bill:* ₹${total}%0A*Time:* ${new Date().toLocaleTimeString()}`;

            speakWithSarvam("ధన్యవాదాలు! మీ ఆర్డర్ కిచెన్‌కు పంపిస్తున్నాను.");
            setTimeout(() => {
                window.location.href = `https://wa.me/${kitchenWa}?text=${msg}`;
            }, 1200);
        }

        window.addEventListener('load', renderMenu);
    </script>
</body>
</html>
