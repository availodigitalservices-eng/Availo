<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVAILO AI VOICE CONCIERGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rajdhani:wght@700;800&family=Ramabhadra&family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040b16;
            --card-bg: rgba(13, 34, 63, 0.72);
            --cyan: #20DDE0;
            --gold: #DDB65D;
            --purple: #8b5cf6;
            --green: #22c55e;
            --accent-green: #16a34a;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 15%, #0c274d 0%, var(--bg-dark) 80%);
            color: var(--text-main);
            font-family: 'Inter', 'Ramabhadra', 'Noto Sans Devanagari', sans-serif;
            min-height: 100vh;
            padding: 14px 14px 115px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* 1. TOP HEADER */
        .brand-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(32, 221, 224, 0.2);
            margin-bottom: 14px;
        }

        .brand-title-wrap {
            text-align: left;
        }

        .brand-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: 2px;
            line-height: 1;
        }

        .brand-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1.2px;
            margin-top: 3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-badge {
            background: rgba(32, 221, 224, 0.12);
            border: 1px solid rgba(32, 221, 224, 0.4);
            color: var(--cyan);
            font-family: 'Rajdhani', sans-serif;
            font-size: 10.5px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.8px;
        }

        .api-cfg-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(32, 221, 224, 0.35);
            color: var(--cyan);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. PURE VOICE AI NEBULA & WAVE STAGE */
        .voice-stage {
            width: 100%;
            background: linear-gradient(175deg, rgba(16, 44, 84, 0.65) 0%, rgba(4, 11, 22, 0.95) 100%);
            border: 1.5px solid rgba(32, 221, 224, 0.4);
            border-radius: 22px;
            padding: 18px 14px 14px;
            margin-bottom: 14px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(32, 221, 224, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .voice-stage.listening {
            border-color: #ef4444;
            box-shadow: 0 0 28px rgba(239, 68, 68, 0.35);
        }

        .voice-stage.speaking {
            border-color: var(--cyan);
            box-shadow: 0 0 32px rgba(32, 221, 224, 0.4);
        }

        .status-chip {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.2px;
            padding: 4px 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--gold);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .voice-stage.listening .status-chip {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .voice-stage.speaking .status-chip {
            background: rgba(32, 221, 224, 0.2);
            color: var(--cyan);
        }

        /* Interactive Core Button */
        .ai-core-btn {
            width: 116px;
            height: 116px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 35% 35%, #20DDE0, #0369a1 65%, #071426 100%);
            box-shadow: 0 0 30px rgba(32, 221, 224, 0.45);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 6px 0 12px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .ai-core-btn:active {
            transform: scale(0.95);
        }

        .voice-stage.listening .ai-core-btn {
            background: radial-gradient(circle at 35% 35%, #f87171, #dc2626 65%, #450a0a 100%);
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.7);
            animation: pulseListen 1.2s infinite ease-in-out;
        }

        @keyframes pulseListen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        #waveCanvas {
            width: 100%;
            height: 44px;
            margin-bottom: 10px;
        }

        .transcript-box {
            width: 100%;
            background: rgba(4, 11, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 12px;
            text-align: left;
        }

        .user-said {
            font-size: 12px;
            color: var(--gold);
            margin-bottom: 4px;
            min-height: 16px;
        }

        .ai-reply {
            font-size: 13.5px;
            color: #ffffff;
            line-height: 1.5;
        }

        /* Quick Voice Command Chips */
        .quick-prompts {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            width: 100%;
            padding-top: 10px;
            scrollbar-width: none;
        }

        .quick-prompts::-webkit-scrollbar { display: none; }

        .q-chip {
            background: rgba(32, 221, 224, 0.1);
            border: 1px solid rgba(32, 221, 224, 0.3);
            color: #e2e8f0;
            font-size: 11.5px;
            padding: 5px 10px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }

        /* 3. LANGUAGE & AUTO-LOOP CONTROLS */
        .control-strip {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 14px;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .lang-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(32, 221, 224, 0.25);
            color: #e2e8f0;
            padding: 7px 6px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .lang-pill.active {
            background: var(--cyan);
            color: #040b16;
            border-color: var(--cyan);
        }

        .auto-loop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #cbd5e1;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 4. COMPACT LIVE CART / MENU */
        .menu-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .dish-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dish-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .dish-price {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: var(--cyan);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .q-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1.5px solid var(--cyan);
            background: rgba(32, 221, 224, 0.1);
            color: var(--cyan);
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .q-num {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 800;
            min-width: 16px;
            text-align: center;
        }

        /* 5. BOTTOM ACTION BAR */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #030811;
            border-top: 1.5px solid rgba(32, 221, 224, 0.25);
            padding: 10px 14px;
            display: flex;
            justify-content: center;
            z-index: 900;
        }

        .dock-inner {
            width: 100%;
            max-width: 440px;
            display: flex;
            gap: 10px;
        }

        .btn-talk {
            flex: 1;
            background: rgba(32, 221, 224, 0.14);
            border: 1.5px solid var(--cyan);
            color: var(--cyan);
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-send-order {
            flex: 1.2;
            background: var(--accent-green);
            border: none;
            color: #ffffff;
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
        }

        .footer-bar {
            margin-top: 18px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .footer-bar span { color: var(--gold); }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- 1. Header -->
        <div class="brand-header">
            <div class="brand-title-wrap">
                <div class="brand-name">AVAILO</div>
                <div class="brand-sub">NEXT-GEN VOICE AI ASSISTANT</div>
            </div>
            <div class="header-right">
                <span class="mode-badge">HANDS-FREE AI</span>
                <button class="api-cfg-btn" onclick="configureSarvamKey()" title="Sarvam API Key">⚙️</button>
            </div>
        </div>

        <!-- 2. Pure Voice AI Stage -->
        <div class="voice-stage" id="voiceStage">
            <div class="status-chip" id="statusChip">● TAP CORE TO START CONVERSATION</div>

            <button class="ai-core-btn" id="aiCoreBtn" onclick="toggleConversation()" aria-label="Talk to AVAILO AI">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
            </button>

            <canvas id="waveCanvas" width="380" height="44"></canvas>

            <div class="transcript-box">
                <div class="user-said" id="userTranscript"></div>
                <div class="ai-reply" id="aiReplyText">
                    "నమస్కారం! మధ్యలో ఉన్న బటన్ నొక్కి మాట్లాడండి — నేను మీ ఆర్డర్ తీసుకుంటాను."
                </div>
            </div>

            <!-- Tap-to-Speak Sample Voice Intents -->
            <div class="quick-prompts">
                <button class="q-chip" onclick="processVoiceCommand('ఈరోజు స్పెషల్స్ ఏంటి?')">"స్పెషల్స్ ఏంటి?"</button>
                <button class="q-chip" onclick="processVoiceCommand('ఒక వెజ్ బిర్యానీ యాడ్ చెయ్')">"వెజ్ బిర్యానీ యాడ్ చెయ్"</button>
                <button class="q-chip" onclick="processVoiceCommand('బిల్ ఎంత అయింది?')">"బిల్ ఎంత?"</button>
                <button class="q-chip" onclick="processVoiceCommand('ఆర్డర్ కన్ఫర్మ్ చెయ్')">"ఆర్డర్ కన్ఫర్మ్ చెయ్"</button>
            </div>
        </div>

        <!-- 3. Language & Hands-Free Loop Control -->
        <div class="control-strip">
            <div class="lang-grid">
                <button class="lang-pill active" onclick="switchLang('te', this)">తెలుగు</button>
                <button class="lang-pill" onclick="switchLang('en', this)">English</button>
                <button class="lang-pill" onclick="switchLang('hi', this)">हिन्दी</button>
            </div>
            <div class="auto-loop-row">
                <span>🔄 ఆటో-కంటిన్యూయస్ సంభాషణ (Auto-Listen)</span>
                <input type="checkbox" id="autoLoopToggle" checked style="width:18px; height:18px; accent-color:#20DDE0;">
            </div>
        </div>

        <!-- 4. Live Order & Menu -->
        <div class="menu-header">
            <span id="menuLabel">మెనూ & లైవ్ బిల్</span>
            <span id="totalCostBadge" style="color: var(--cyan);">₹0</span>
        </div>

        <div class="menu-list" id="menuContainer"></div>

        <!-- 5. Footer -->
        <div class="footer-bar">
            Table No: <span id="tableNumber">01</span> · Powered by <span>AVAILO VOICE ENGINE</span>
        </div>
    </div>

    <!-- 6. Bottom Dock -->
    <div class="bottom-dock">
        <div class="dock-inner">
            <button class="btn-talk" onclick="startListening()">🎤 మాట్లాడండి</button>
            <button class="btn-send-order" onclick="sendWhatsAppOrder()">🛒 ఆర్డర్ పంపండి (<span id="cartCount">0</span>)</button>
        </div>
    </div>

    <script>
        const DEFAULT_SARVAM_KEY = "YOUR_SARVAM_API_KEY_HERE";

        function getSarvamKey() {
            const saved = localStorage.getItem('availo_sarvam_key');
            return (saved && saved.trim() !== "") ? saved.trim() : DEFAULT_SARVAM_KEY;
        }

        function configureSarvamKey() {
            const current = localStorage.getItem('availo_sarvam_key') || "";
            const userKey = prompt("మీ Sarvam AI API Key ఇక్కడ పేస్ట్ చేయండి:", current);
            if (userKey !== null) {
                localStorage.setItem('availo_sarvam_key', userKey.trim());
                alert("Sarvam AI Key సేవ్ అయింది!");
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const cleanDigits = (urlParams.get('table') || "01").replace(/[^0-9]/g, '');
        const tableParam = cleanDigits ? cleanDigits.slice(0, 3) : "01";
        const hotelParam = urlParams.get('hotel');
        const kitchenWa = (urlParams.get('desk') || "919966157369").replace(/[^0-9]/g, '');

        document.getElementById('tableNumber').innerText = tableParam;

        let currentLang = 'te';
        let currentAudio = null;
        let recognition = null;
        let isListening = false;
        let waveState = 'idle'; // idle | listening | speaking

        const LANG_DATA = {
            te: {
                code: "te-IN",
                speaker: "anushka",
                hotel: hotelParam || "అమరావతి గ్రాండ్",
                welcome: `నమస్కారం! ${hotelParam || "అమరావతి గ్రాండ్"} కి స్వాగతం. మీరు టేబుల్ ${tableParam} లో ఉన్నారు. మీకు ఏం కావాలో చెప్పండి?`,
                specials: "ఈరోజు మా స్పెషల్ వెజ్ దమ్ బిర్యానీ 220 రూపాయలు, చికెన్ దమ్ బిర్యానీ 280 రూపాయలు, మరియు వేడివేడి మసాలా దోశ 80 రూపాయలు. ఏది యాడ్ చేయమంటారు?",
                emptyWarn: "మీ కార్ట్‌లో ఇంకా ఏ ఐటమ్స్ లేవు. ముందుగా ఏదైనా ఐటమ్ చెప్పండి.",
                confirming: (total) => `మీ మొత్తం బిల్ ${total} రూపాయలు అయింది. ఆర్డర్ ఇప్పుడే కిచెన్‌కు పంపిస్తున్నాను!`
            },
            en: {
                code: "en-IN",
                speaker: "anushka",
                hotel: hotelParam || "Amaravati Grand",
                welcome: `Welcome to ${hotelParam || "Amaravati Grand"}! You are at Table ${tableParam}. What would you like to order today?`,
                specials: "Today's specials are Special Veg Dum Biryani at 220 rupees, Chicken Dum Biryani at 280 rupees, and Masala Dosa at 80 rupees. Which one should I add?",
                emptyWarn: "Your order list is empty. Please tell me what you would like to have.",
                confirming: (total) => `Your total bill is ${total} rupees. Sending your order to the kitchen now!`
            },
            hi: {
                code: "hi-IN",
                speaker: "anushka",
                hotel: hotelParam || "अमरावती ग्रैंड",
                welcome: `नमस्ते! ${hotelParam || "अमरावती ग्रैंड"} में आपका स्वागत है। आप टेबल नंबर ${tableParam} पर हैं। आज आप क्या ऑर्डर करना चाहेंगे?`,
                specials: "आज के स्पेशल में वेज दम बिरयानी 220 रुपये, चिकन दम बिरयानी 280 रुपये और मसाला डोसा 80 रुपये है। क्या जोड़ूं?",
                emptyWarn: "आपकी ऑर्डर लिस्ट खाली है। कृपया पहले कोई आइटम बोलें।",
                confirming: (total) => `आपका कुल बिल ${total} रुपये है। आपका ऑर्डर अभी किचन में भेज रहा हूँ!`
            }
        };

        const MENU = [
            { id: 'biryani', price: 220, count: 0, names: { te: 'స్పెషల్ వెజ్ దమ్ బిర్యానీ', en: 'Special Veg Dum Biryani', hi: 'स्पेशल वेज दम बिरयानी' }, keys: ['వెజ్ బిర్యానీ', 'బిర్యానీ', 'biryani', 'बिरयानी'] },
            { id: 'chickenBiryani', price: 280, count: 0, names: { te: 'చికెన్ దమ్ బిర్యానీ', en: 'Chicken Dum Biryani', hi: 'चिकन दम बिरयानी' }, keys: ['చికెన్', 'chicken', 'चिकन'] },
            { id: 'dosa', price: 80, count: 0, names: { te: 'మసాలా దోశ', en: 'Masala Dosa', hi: 'मसाला डोसा' }, keys: ['దోశ', 'దోస', 'dosa', 'डोसा'] },
            { id: 'coffee', price: 40, count: 0, names: { te: 'ఫిల్టర్ కాఫీ', en: 'Filter Coffee', hi: 'फ़िल्टर कॉफ़ी' }, keys: ['కాఫీ', 'coffee', 'कॉफ़ी'] }
        ];

        // 🌊 SMOOTH AUDIO WAVE VISUALIZER
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let phase = 0;

        function animateWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const midY = canvas.height / 2;
            const amp = waveState === 'speaking' ? 16 : (waveState === 'listening' ? 12 : 3);
            const color = waveState === 'listening' ? '#ef4444' : '#20DDE0';

            for (let layer = 0; layer < 2; layer++) {
                ctx.beginPath();
                ctx.lineWidth = layer === 0 ? 2.5 : 1.2;
                ctx.strokeStyle = layer === 0 ? color : '#DDB65D';

                for (let x = 0; x < canvas.width; x++) {
                    const env = Math.sin((x / canvas.width) * Math.PI);
                    const y = midY + Math.sin(x * 0.04 + phase + layer) * amp * env;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            phase += waveState === 'idle' ? 0.04 : 0.18;
            requestAnimationFrame(animateWave);
        }
        animateWave();

        function setStageUI(state, chipText) {
            waveState = state;
            const stage = document.getElementById('voiceStage');
            stage.classList.remove('listening', 'speaking');
            if (state === 'listening') stage.classList.add('listening');
            if (state === 'speaking') stage.classList.add('speaking');
            document.getElementById('statusChip').innerText = chipText;
        }

        // 🧠 CONVERSATIONAL AI ENGINE
        function processVoiceCommand(rawText) {
            const text = rawText.toLowerCase().trim();
            document.getElementById('userTranscript').innerText = `మీరు: "${rawText}"`;

            // 1. Check Specials / Menu Query
            if (text.includes('స్పెషల్') || text.includes('మెనూ') || text.includes('ఏమున్నాయి') || text.includes('special') || text.includes('menu') || text.includes('मेनू')) {
                speakResponse(LANG_DATA[currentLang].specials, true);
                return;
            }

            // 2. Check Bill Query
            if (text.includes('బిల్') || text.includes('ఎంత') || text.includes('bill') || text.includes('total') || text.includes('बिल')) {
                const { qty, total } = getCartTotals();
                const msg = currentLang === 'te'
                    ? (qty === 0 ? "మీరు ఇంకా ఏమీ ఆర్డర్ చేయలేదు. ఏం యాడ్ చేయమంటారు?" : `మీ ఆర్డర్‌లో ${qty} ఐటమ్స్ ఉన్నాయి, మొత్తం బిల్ ${total} రూపాయలు. ఆర్డర్ పంపమంటారా?`)
                    : `You have ${qty} items totaling ${total} rupees. Should I send the order?`;
                speakResponse(msg, true);
                return;
            }

            // 3. Check Order Confirmation / Send
            if (text.includes('కన్ఫర్మ్') || text.includes('పంపించు') || text.includes('పంపు') || text.includes('confirm') || text.includes('send') || text.includes('भेज')) {
                sendWhatsAppOrder();
                return;
            }

            // 4. Check Remove / Cancel Item
            const isRemove = text.includes('తీసేయ్') || text.includes('వద్దు') || text.includes('remove') || text.includes('cancel') || text.includes('हटा');

            let qty = 1;
            if (text.includes('రెండు') || text.includes('two') || text.includes('दो') || text.includes('2')) qty = 2;
            if (text.includes('మూడు') || text.includes('three') || text.includes('तीन') || text.includes('3')) qty = 3;

            let matchedItem = null;
            MENU.forEach(item => {
                if (item.keys.some(k => text.includes(k))) {
                    if (isRemove) {
                        item.count = Math.max(0, item.count - qty);
                    } else {
                        item.count += qty;
                    }
                    matchedItem = item;
                }
            });

            renderMenu();

            if (matchedItem) {
                const { total } = getCartTotals();
                if (isRemove) {
                    speakResponse(`${matchedItem.names[currentLang]} తొలగించాను. ఇంకా ఏమైనా మార్చాలా?`, true);
                } else {
                    const upsell = matchedItem.id.includes('biryani')
                        ? "దీనికి తోడుగా చల్లని ఫిల్టర్ కాఫీ లేదా మసాలా దోశ యాడ్ చేయమంటారా? లేదంటే 'ఆర్డర్ కన్ఫర్మ్' అని చెప్పండి."
                        : "ఇంకా ఏమైనా కావాలా? లేదంటే 'ఆర్డర్ పంపించు' అని చెప్పండి.";
                    speakResponse(`${qty} ${matchedItem.names[currentLang]} యాడ్ చేశాను. మొత్తం బిల్ ${total} రూపాయలు. ${upsell}`, true);
                }
            } else {
                speakResponse(`మీరు "${rawText}" అన్నారు. దయచేసి బిర్యానీ, దోశ లేదా కాఫీ అని చెప్పండి — లేదా 'స్పెషల్స్ ఏంటి' అని అడగండి.`, true);
            }
        }

        // 🎙️ SARVAM AI TTS + AUTO-LISTEN CHAIN
        async function speakResponse(text, autoListenAfter = false) {
            document.getElementById('aiReplyText').innerText = `"${text}"`;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const onSpeechFinish = () => {
                setStageUI('idle', '● READY TO LISTEN');
                if (autoListenAfter && document.getElementById('autoLoopToggle').checked) {
                    setTimeout(() => startListening(), 400);
                }
            };

            const apiKey = getSarvamKey();
            if (!apiKey || apiKey === "YOUR_SARVAM_API_KEY_HERE") {
                fallbackSpeak(text, onSpeechFinish);
                return;
            }

            try {
                setStageUI('speaking', '🔊 AI SPEAKING...');
                const response = await fetch("https://api.sarvam.ai/text-to-speech", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "api-subscription-key": apiKey
                    },
                    body: JSON.stringify({
                        inputs: [text],
                        target_language_code: LANG_DATA[currentLang].code,
                        speaker: LANG_DATA[currentLang].speaker,
                        pace: 1.02,
                        speech_sample_rate: 16000,
                        enable_preprocessing: true,
                        model: "bulbul:v2"
                    })
                });

                const data = await response.json();
                if (data && data.audios && data.audios[0]) {
                    currentAudio = new Audio("data:audio/wav;base64," + data.audios[0]);
                    currentAudio.onended = onSpeechFinish;
                    currentAudio.onerror = onSpeechFinish;
                    await currentAudio.play();
                } else {
                    fallbackSpeak(text, onSpeechFinish);
                }
            } catch (e) {
                fallbackSpeak(text, onSpeechFinish);
            }
        }

        function fallbackSpeak(text, doneCb) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = LANG_DATA[currentLang].code;
                setStageUI('speaking', '🔊 AI SPEAKING...');
                utter.onend = doneCb;
                utter.onerror = doneCb;
                window.speechSynthesis.speak(utter);
            } else {
                doneCb();
            }
        }

        function startListening() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("Voice recognition works best in Chrome.");
                return;
            }
            if (currentAudio) {
                currentAudio.pause();
            }
            window.speechSynthesis.cancel();

            recognition = new SpeechRec();
            recognition.lang = LANG_DATA[currentLang].code;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                setStageUI('listening', '🔴 LISTENING... SPEAK NOW');
            };

            recognition.onresult = (event) => {
                isListening = false;
                const spoken = event.results[0][0].transcript;
                processVoiceCommand(spoken);
            };

            recognition.onerror = () => {
                isListening = false;
                setStageUI('idle', '● TAP MIC TO SPEAK');
            };

            recognition.onend = () => {
                isListening = false;
                if (waveState === 'listening') {
                    setStageUI('idle', '● TAP MIC TO SPEAK');
                }
            };

            recognition.start();
        }

        function toggleConversation() {
            if (isListening && recognition) {
                recognition.stop();
                setStageUI('idle', '● PAUSED');
            } else {
                speakResponse(LANG_DATA[currentLang].welcome, true);
            }
        }

        function switchLang(lang, el) {
            currentLang = lang;
            document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderMenu();
            speakResponse(LANG_DATA[lang].welcome, true);
        }

        function changeQty(id, delta) {
            const item = MENU.find(i => i.id === id);
            if (!item) return;
            item.count = Math.max(0, item.count + delta);
            renderMenu();
        }

        function getCartTotals() {
            let qty = 0, total = 0;
            MENU.forEach(i => { qty += i.count; total += i.count * i.price; });
            return { qty, total };
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = MENU.map(item => `
                <div class="dish-card">
                    <div>
                        <div class="dish-name">${item.names[currentLang]}</div>
                        <span class="dish-price">₹${item.price}</span>
                    </div>
                    <div class="qty-controls">
                        <button class="q-btn" onclick="changeQty('${item.id}', -1)">-</button>
                        <span class="q-num">${item.count}</span>
                        <button class="q-btn" onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                </div>
            `).join('');

            const { qty, total } = getCartTotals();
            document.getElementById('cartCount').innerText = qty;
            document.getElementById('totalCostBadge').innerText = `₹${total}`;
        }

        function sendWhatsAppOrder() {
            const selected = MENU.filter(i => i.count > 0);
            if (selected.length === 0) {
                speakResponse(LANG_DATA[currentLang].emptyWarn, true);
                return;
            }
            const { total } = getCartTotals();
            const itemsStr = selected.map(i => `• ${i.names.en} (${i.names.te}) x ${i.count} = ₹${i.count * i.price}`).join('%0A');
            const msg = `*AVAILO VOICE AI - KITCHEN ORDER*%0A-----------------------------%0A*Restaurant:* ${LANG_DATA.en.hotel}%0A*Table No:* ${tableParam}%0A*Language:* ${currentLang.toUpperCase()}%0A-----------------------------%0A${itemsStr}%0A-----------------------------%0A*Total Bill:* ₹${total}%0A*Time:* ${new Date().toLocaleTimeString()}`;

            speakResponse(LANG_DATA[currentLang].confirming(total), false);
            setTimeout(() => {
                window.location.href = `https://wa.me/${kitchenWa}?text=${msg}`;
            }, 2200);
        }

        window.addEventListener('load', renderMenu);
    </script>
